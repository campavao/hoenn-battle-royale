<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>HBR emulator spike</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #101418; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
      header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0; }
      #stats { font-variant-numeric: tabular-nums; color: #9fb3c0; white-space: pre; }
      #screen { flex: 0 0 auto; display: grid; place-items: center; background: #000; touch-action: none; }
      canvas { image-rendering: pixelated; width: min(100vw, 480px); aspect-ratio: 240 / 160; height: auto; display: block; }
      #pad { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
      .dpad { display: grid; grid-template: repeat(3, 56px) / repeat(3, 56px); gap: 4px; justify-content: start; }
      .btn { display: grid; place-items: center; background: #26313a; border-radius: 10px; color: #cfe3ef; font-weight: 600; touch-action: none; }
      .btn:active, .btn.down { background: #4c7a99; }
      .ab { display: grid; grid-template-columns: 72px 72px; gap: 12px; justify-content: end; align-content: start; }
      .ab .btn { height: 72px; border-radius: 50%; }
      .sys { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; }
      .sys .btn { width: 80px; height: 32px; font-size: 12px; }
      #setup { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      #setup.hidden { display: none; }
      #log { font: 12px/1.4 ui-monospace, monospace; color: #9fb3c0; white-space: pre-wrap; padding: 0 12px 12px; }
      button, input { font: inherit; }
      button.big { padding: 12px; background: #2c7be5; color: white; border: 0; border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>HBR spike</h1>
      <div id="stats">fps —</div>
    </header>
    <section id="setup">
      <p>Pick your own <b>Pokémon Emerald (U)</b> ROM. It stays in this browser (IndexedDB); nothing is uploaded.</p>
      <input id="rom" type="file" accept=".gba" />
      <button id="play" class="big" disabled>Play</button>
      <button id="forget">Forget stored ROM</button>
    </section>
    <div id="screen"><canvas id="canvas" width="240" height="160"></canvas></div>
    <div id="pad">
      <div class="dpad">
        <div></div><div class="btn" data-key="up">▲</div><div></div>
        <div class="btn" data-key="left">◀</div><div></div><div class="btn" data-key="right">▶</div>
        <div></div><div class="btn" data-key="down">▼</div><div></div>
      </div>
      <div class="ab">
        <div class="btn" data-key="b">B</div>
        <div class="btn" data-key="a">A</div>
      </div>
      <div class="sys">
        <div class="btn" data-key="select">SELECT</div>
        <div class="btn" data-key="start">START</div>
        <div class="btn" id="ram">READ RAM</div>
        <div class="btn" id="ff">FF x1</div>
      </div>
    </div>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
