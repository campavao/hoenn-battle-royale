name: BR CI

# Runs against the mod's own branch, not upstream's `master` (that's build.yml, pret's
# CI). Kept as a second workflow file instead of extending build.yml so a `git merge`
# from upstream never has to touch a line we own.
on:
  push:
    branches: [hoenn-battle-royale]
    # A tag is a release (POK-248): the same build, then the `release` job at the end
    # publishes it. `git tag -a v0.1.0 -m "..."` and push the tag; the message is the
    # release note.
    # A dispatched run (below) is the same release without pushing the tag yourself.
    tags: ['v*']
  pull_request:
    branches: [hoenn-battle-royale]
  # A release without pushing a tag: Actions -> BR CI -> Run workflow on
  # hoenn-battle-royale with a version (or the API's workflow_dispatch, which is how a
  # cloud session ships -- it can't push tags). The same jobs as a tag; the release job
  # makes the tag itself, at the commit this run built, once everything is green. A tag
  # pushed with GITHUB_TOKEN starts no workflow, so this run is the only one.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to cut, e.g. v0.2.2'
        required: true
      notes:
        description: 'Release note; blank lists the commits since the last tag'
        required: false
        default: ''

concurrency:
  # A release never shares the branch's group: a push landing mid-release would
  # cancel it.
  group: br-ci-${{ github.event_name == 'workflow_dispatch' && format('release-{0}', inputs.version) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # Every BR touch in a pret file sits under `#if BR` / `.if BR` (docs/C-STYLE.md), so a
  # pret merge only ever meets our lines in guarded blocks. Seconds, no toolchain.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Upstream edits are guarded
        run: python3 tools/br/check-guards.py
      # The lint sees names; this sees lines. With the guards taken out, every pret file
      # must be pret's at the commit we fork from -- no reformatted line, no trailing
      # comma, no blank line beside a hook. The shallow checkout lacks that commit, so it
      # is fetched by sha first (it is reachable from this branch).
      - name: Pret's lines are pret's outside the guards
        run: |
          git fetch --depth=1 --no-tags origin "$(cat tools/br/BASELINE_COMMIT)"
          python3 tools/br/pret-intact.py

  # Builds both ROMs (baseline pret, and this fork) with agbcc - the byte-matching
  # compiler, because the release patch must be a diff of our changes only, never a
  # modern-GCC recompile of the whole game riding along. Ends with the one artifact
  # players' browsers actually load (never a .gba) and, since it already has a built
  # ROM sitting right there, the harness smoke test too (see the comment on that step
  # for why it isn't job of its own).
  rom:
    # No `needs`: the e2e steps at the end boot the tracked core in web/public/emu --
    # the one Vercel ships -- not one the wasm job builds (see that job).
    runs-on: ubuntu-latest
    # Two clean agbcc builds (~9 min each uncached), 110 drivers, then 17 Playwright
    # files with retries. Without a ceiling a hung ROM or browser holds a runner for the
    # platform's six hours.
    timeout-minutes: 90
    outputs:
      rom-sha1: ${{ steps.fork-rom.outputs.sha1 }}
      patch-size: ${{ steps.patch.outputs.size }}
    steps:
      - uses: actions/checkout@v7

      # A dispatched release: checked here, before the hour of build, not after it. A
      # tag that already names this commit is a re-run of a release that failed past
      # its tag (a deploy, say), so it goes through; one naming any other commit fails.
      - name: The version is a new tag, or this commit's
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/hoenn-battle-royale ]; then
            echo "::error::release from hoenn-battle-royale, not $GITHUB_REF"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          # Peeled last, so an annotated tag answers with its commit.
          # On its own line: in a pipe (no pipefail here) a failed lookup read as "new".
          refs="$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")"
          at="$(printf '%s\n' "$refs" | tail -n1 | cut -f1)"
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION already exists, at $at"; exit 1
          fi

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi \
            cmake zlib1g-dev
        # cmake + zlib1g-dev are only for the drive.sh smoke step at the end of this
        # job (libmgba, static, headless) - see that step.

      - name: Read baseline commit
        id: baseline
        run: echo "sha=$(cat tools/br/BASELINE_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Checkout agbcc
        uses: actions/checkout@v7
        with:
          repository: pret/agbcc
          path: agbcc

      - name: agbcc HEAD sha
        id: agbcc-sha
        run: echo "sha=$(git -C agbcc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache agbcc build
        id: agbcc-cache
        uses: actions/cache@v6
        with:
          path: agbcc
          key: agbcc-${{ steps.agbcc-sha.outputs.sha }}

      - name: Build agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        working-directory: agbcc
        run: ./build.sh

      - name: Checkout baseline pokeemerald
        uses: actions/checkout@v7
        with:
          repository: pret/pokeemerald
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline

      - name: Cache baseline ROM
        id: baseline-cache
        uses: actions/cache@v6
        with:
          path: baseline/pokeemerald.gba
          # The baseline never changes without BASELINE_COMMIT changing, so once this
          # is cached, every push and PR skips a ~9 minute clean pret build entirely.
          key: baseline-rom-${{ steps.baseline.outputs.sha }}

      - name: Build baseline ROM
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          ( cd agbcc && ./install.sh ../baseline )
          make -C baseline -j"$(nproc)"

      - name: Verify baseline ROM sha1
        # The whole point of pinning BASELINE_COMMIT is that this ROM is a known
        # quantity; a mismatch here means the pin or the agbcc build drifted, and every
        # downstream step (the patch, the symbols) would be diffing against the wrong
        # thing without this catching it first.
        run: tools/br/check-rom.sh baseline/pokeemerald.gba

      - name: Install agbcc into fork
        run: ( cd agbcc && ./install.sh .. )

      - name: Build fork ROM
        run: make -j"$(nproc)"

      - name: RAM headroom
        # EWRAM was down to 80 bytes before POK-330 #21 took the handler table back, and
        # the linker only complains once a build is already over. This prints what is
        # left on every build and fails under 128 bytes, while there is still a choice.
        shell: bash
        run: python3 tools/br/ram-headroom.py pokeemerald.map | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fork ROM sha1
        id: fork-rom
        run: echo "sha1=$(sha1sum pokeemerald.gba | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Before the patch: make-patch.sh checks what flips wrote with the page's own BPS
      # decoder (tools/br/make-bps.ts, under vite-node), and the e2e steps at the end of
      # this job need the same install.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - name: Build patch, symbols, version
        id: patch
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p patch
          # flips at a pinned commit, then the round trip (retail + patch = this ROM, byte
          # for byte) and the size ceiling; a patch that fails either is never written.
          tools/br/make-patch.sh baseline/pokeemerald.gba pokeemerald.gba patch/hoenn-br.bps
          python3 tools/br/symbols.py pokeemerald.map > patch/br-symbols.json
          # On a release the shell is named after its tag (v0.1.0 -> "0.1.0"); otherwise
          # package.json's, as on every push.
          if [ "${{ github.ref_type }}" = "tag" ]; then export HBR_SHELL_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$INPUT_VERSION" ]; then export HBR_SHELL_VERSION="${INPUT_VERSION#v}"; fi
          tools/br/version-json.sh pokeemerald.gba patch/br-version.json
          echo "size=$(stat -c%s patch/hoenn-br.bps)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### hoenn-br patch"
            echo "- patch size: ${{ steps.patch.outputs.size }} bytes"
            echo "- fork ROM sha1: ${{ steps.fork-rom.outputs.sha1 }}"
            echo "- baseline commit: ${{ steps.baseline.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: patch
          # Exactly these three files - never the ROM itself, on principle (see
          # CLAUDE.md: "the ROM is never anywhere but the player's device").
          path: |
            patch/hoenn-br.bps
            patch/br-symbols.json
            patch/br-version.json
          if-no-files-found: error

      - name: Cache libmgba (harness)
        id: mgba-cache
        uses: actions/cache@v6
        with:
          path: tools/br/.mgba
          key: libmgba-harness-0.10.5-v2-${{ runner.os }}

      - name: Drive the fork ROM
        # Every driver, not just `smoke`. The drivers ARE the ROM's test suite -- each
        # one boots the real thing, pokes the mailbox and asserts on RAM -- and running
        # one of them was running 3% of it.
        #
        # Folded into this job instead of a separate `harness` job: a standalone job
        # would either re-download the ROM as an artifact (banned - see above) or
        # rebuild it from scratch, doubling the build time for no reason when the ROM
        # this job just built is sitting right here on disk.
        #
        # drive-all.sh also fails a driver that asserts nothing: the harness passes a
        # driver with no expect, so each one carries expects, a `# checked-by:` script
        # (objects-band -> objects-band.py) or an explicit `# capture-only:`.
        run: tools/br/drive-all.sh pokeemerald.gba

      - name: Sidecars for the web shell's local-build path (POK-220)
        # web/e2e drives the shell the same way `npm run dev` does: a pre-patched ROM
        # plus the two sidecars (see tools/br/dev-patch.sh and app.ts's isPrePatched()
        # branch). Same pokeemerald.gba/.map this job just built. With the baseline it
        # also writes the BPS, so patch.spec.ts can patch a stock ROM in the tab the way
        # a player does, instead of skipping.
        run: tools/br/dev-patch.sh pokeemerald.map baseline/pokeemerald.gba

      - working-directory: web
        run: npx playwright install --with-deps chromium

      # Playwright's first webServer is `node ../relay/server.js`, which imports `ws`.
      - working-directory: relay
        run: npm ci --ignore-scripts

      # Every spec in Chromium, play.spec.ts's whole match among them (POK-327: a shot a
      # step under e2e/out/play/chromium). Its Firefox project is the play-firefox job's.
      - working-directory: web
        env:
          HBR_ROM: ${{ github.workspace }}/pokeemerald.gba
          # The pret baseline, which check-rom.sh proved is retail byte for byte.
          HBR_BASE_ROM: ${{ github.workspace }}/baseline/pokeemerald.gba
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shots
          # Screenshots only, never the ROM (see the artifact-upload comment above).
          path: web/e2e/out
          if-no-files-found: warn

  # A release only (a tag or a dispatch): the match played in Firefox (POK-327). The rom job plays it in Chromium
  # on every push; Firefox is where Cam's 2026-09-18 video had the picture squashed, and
  # a second browser on every push is five more minutes, so it waits for a release. The
  # ROM never leaves the rom job, so this one starts where a player does: the retail
  # baseline (the rom job's cache, proved retail there) patched in the tab with the
  # patch the rom job built. Not in release's `needs` until it has been green on a tag:
  # headless Firefox with WebGL and SharedArrayBuffer is unproven on this runner.
  play-firefox:
    # TEMPORARY (PR #10): on this PR too, for the key layer's diagnostic. Drop before merge.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: rom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read baseline commit
        id: baseline
        run: echo "sha=$(cat tools/br/BASELINE_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Restore baseline ROM
        uses: actions/cache/restore@v6
        with:
          path: baseline/pokeemerald.gba
          key: baseline-rom-${{ steps.baseline.outputs.sha }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with: { name: patch, path: web/public/patch }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps firefox

      # Playwright's first webServer is the relay (see the rom job).
      - working-directory: relay
        run: npm ci --ignore-scripts

      - working-directory: web
        env:
          # Retail: the page patches it, as it does a player's ROM.
          HBR_ROM: ${{ github.workspace }}/baseline/pokeemerald.gba
          HBR_PLAY_FIREFOX: '1'
          # Headed on a virtual display: headless Firefox on the runner has no WebGL, and
          # without it the core draws nothing (see playwright.config.ts).
          HBR_FIREFOX_HEADED: '1'
        run: xvfb-run -a npx playwright test --project play-firefox

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shots-firefox
          path: web/e2e/out
          if-no-files-found: warn

  # Is the shipped core the one the committed patch builds? web/public/emu is tracked,
  # it is what Vercel serves and what the e2e boots, and it comes from a WSL build on a
  # dev box (docs/DEPLOY.md). This runs the same script, tools/br/mgba-wasm/build.sh
  # (mGBA's wasm fork at COMMIT plus hbr-exports.patch), and fails unless the sha256s are
  # the tracked ones. Emscripten is byte-stable across machines; what used to differ was
  # the git state mGBA stamps into the core, from a full detached clone here and a
  # depth-1 branch clone there, and build.sh now checks out the same shape on both.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.5 # build.sh refuses any other emcc
          # emsdk itself, which picks the node emcc runs on: the dev box's (24.19.0).
          # Unset, v15+ fetches emsdk at `version`, whose 6.0.5 tag runs node 22.
          emsdk-version: 6.0.9

      # No build cache here: CMakeCache pins the emsdk path, which is a per-run temp dir.
      - name: Build the wasm core
        run: bash tools/br/mgba-wasm/build.sh mgba-wasm-src

      - name: Compare with the tracked core
        run: |
          drift=0
          for f in mgba.wasm mgba.js mgba.d.ts; do
            want="$(sha256sum "web/public/emu/$f" | cut -d' ' -f1)"
            got="$(sha256sum "mgba-wasm-src/build-wasm/wasm/$f" | cut -d' ' -f1)"
            if [ "$want" = "$got" ]; then
              echo "same $f $got"
            else
              echo "DIFF $f: tracked $want, built $got"
              drift=1
            fi
          done
          if [ "$drift" -eq 1 ]; then
            echo "::error title=wasm core drift::web/public/emu is not what tools/br/mgba-wasm/build.sh builds from hbr-exports.patch. The site ships the tracked core: rebuild it with that script and commit it (docs/DEPLOY.md). The build is the emu-built artifact."
            echo "### wasm core: tracked != built (artifact emu-built)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### wasm core: tracked == built" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        # On drift too: the build it disagreed with is the thing to look at.
        if: ${{ !cancelled() }}
        with:
          name: emu-built
          path: |
            mgba-wasm-src/build-wasm/wasm/mgba.js
            mgba-wasm-src/build-wasm/wasm/mgba.wasm
            mgba-wasm-src/build-wasm/wasm/mgba.d.ts
          if-no-files-found: warn

  # The shell's own checks: typecheck, the unit suite, and a production build with the
  # no-ROM check after it. None of it reads public/patch (the unit tests stub the
  # sidecars) and the core it types against is the tracked web/public/emu, so it needs
  # no other job. It used to wait on rom + wasm, and a red ROM build -- nine days of
  # them in September -- meant the 576 unit tests never ran at all. The one build
  # output it does need, map_groups.h, it makes itself (the step before the tests).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, without the blobs nobody reads: web/scripts/wire-protocols.test.ts
      # holds every committed version of tools/br/wire-protocols.txt to the rows it had,
      # and refuses a shallow clone (POK-331 #21).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npm run typecheck

      # bosses.test.ts reads include/constants/map_groups.h raw. `make` generates it
      # from data/maps/map_groups.json and git ignores it, so on this bare checkout the
      # suite failed to load on every push while passing on any machine that had built.
      # One generator, not the build: mapjson is plain C++ and g++ is on the runner.
      # web/scripts/ci-inputs.test.ts fails a raw import that is neither tracked nor
      # named here.
      - name: Generate map_groups.h
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          test -s include/constants/map_groups.h

      - working-directory: web
        run: npm test

      # The site a tag deploys is built by Vercel from the repo, not from this job, so
      # the build here is a check (it compiles, and scripts/no-rom.mjs finds no ROM in
      # it) rather than an artifact anybody downloads.
      - working-directory: web
        run: npm run build

  # The relay's own suite: room protocol, the version gate, the flood disconnect, the
  # idle sweep, /health.
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        working-directory: relay
        run: |
          npm ci --ignore-scripts
          # A test that hangs fails in a minute instead of holding the job to its timeout.
          node --test --test-timeout=60000

      # The play log reads this relay's lines (POK-248), so its parser is pinned here,
      # next to the thing that writes them. No dependencies: node alone.
      - name: Test the play log's parser
        run: node --test tools/br/play-log.test.mjs

  # A release only (a tag or a dispatch): `make BR=0` is retail Emerald, byte for byte (docs/C-STYLE.md). Every
  # hook compiles away without BR, so a mismatch is BR code that got out of its guard
  # somewhere neither guards step can see -- a macro, a data table, a linker line. A
  # clean agbcc build is ~9 minutes, so it waits for a release instead of every push,
  # and the release waits for it. The agbcc cache is the rom job's.
  pret:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Checkout agbcc
        uses: actions/checkout@v7
        with:
          repository: pret/agbcc
          path: agbcc

      - name: agbcc HEAD sha
        id: agbcc-sha
        run: echo "sha=$(git -C agbcc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache agbcc build
        id: agbcc-cache
        uses: actions/cache@v6
        with:
          path: agbcc
          key: agbcc-${{ steps.agbcc-sha.outputs.sha }}

      - name: Build agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        working-directory: agbcc
        run: ./build.sh

      - name: Install agbcc into fork
        run: ( cd agbcc && ./install.sh .. )

      - name: Build with BR=0
        run: make BR=0 -j"$(nproc)"

      - name: BR=0 is retail
        run: tools/br/check-rom.sh pokeemerald_pret.gba

  # A tag is a release (POK-248). Three things go out, in this order, each only after
  # the one before it held:
  #
  #   1. a GitHub release carrying the patch and its two sidecars -- never a ROM. The
  #      BPS needs no retail Emerald: the rom job diffs this fork against the baseline
  #      pret build, which agbcc reproduces byte for byte.
  #   2. the site, to Vercel production, from the repo root (the project's Root
  #      Directory is web/) with the patch already in web/public/patch. Skipped with a
  #      warning until VERCEL_TOKEN is in this repo's secrets; tools/br/release-web.sh
  #      is the same deploy by hand.
  #   3. the relay, to Railway -- ONLY when relay/ changed since the previous tag,
  #      because a relay deploy restarts it and every room in it is lost.
  #
  # Nothing here runs on a branch push; a broken tag can be deleted and re-pushed. A
  # dispatched run (see `on:`) makes its tag here, first, so the rest reads the same.
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [rom, web, relay, pret]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
      SITE: https://hoenn-battle-royale.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag, for the relay's "did it change" check

      - uses: actions/download-artifact@v8
        with: { name: patch, path: web/public/patch }

      - name: Tag the commit this run built (dispatched release)
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Already here (fetch-depth 0) only on a re-run, and the rom job proved it names
          # this commit.
          at="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ "$at" = "$GITHUB_SHA" ]; then exit 0; fi
          if [ -n "$at" ]; then echo "::error::$TAG already exists, at $at"; exit 1; fi
          if [ -n "$NOTES" ]; then git tag -a "$TAG" -m "$NOTES" "$GITHUB_SHA"; else git tag "$TAG" "$GITHUB_SHA"; fi
          git push origin "refs/tags/$TAG"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NOTES: ${{ inputs.notes }}
        run: |
          # A release published from GitHub's own page (Releases -> Draft a new release,
          # which is how a phone ships one) already exists with its author's notes: the
          # patch goes onto it. `gh release create` there failed the job before the site.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              web/public/patch/hoenn-br.bps web/public/patch/br-symbols.json web/public/patch/br-version.json
            exit 0
          fi
          # An annotated tag's message is the release note, in the author's own words;
          # a bare tag gets GitHub's list of commits since the last one.
          # A dispatched run's note is its `notes` input (its tag carries the same).
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then notes="$DISPATCH_NOTES"
          else notes="$(git tag -l --format='%(contents)' "$TAG")"; fi
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md \
              web/public/patch/hoenn-br.bps web/public/patch/br-symbols.json web/public/patch/br-version.json
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              web/public/patch/hoenn-br.bps web/public/patch/br-symbols.json web/public/patch/br-version.json
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Site to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Identifiers, not secrets: the same two in .vercel/project.json on a linked
          # checkout. With them set the CLI needs no `vercel link`.
          VERCEL_ORG_ID: team_gaLIYr6KzQS9rVhAXaQH5gnQ
          VERCEL_PROJECT_ID: prj_aEr5EE6Or7i7sflksOzk0MI6XOeT
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::no VERCEL_TOKEN in this repo's secrets; the site was not deployed. Run tools/br/release-web.sh --prod by hand, or add the token (Vercel -> Account Settings -> Tokens)."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          # The same checks release-web.sh runs: the three patch files answer, the ROM
          # 404s, and the live br-version.json names this build. Production is public,
          # so plain curl.
          want="$(python3 -c 'import json;print(json.load(open("web/public/patch/br-version.json"))["romSha1"])')"
          tools/br/verify-site.sh "$SITE" "$want"

      - name: Relay to Railway, if relay/ changed since the previous tag
        env:
          # The project token first (production only; the play log reads with it), the
          # account token if there is none -- Railway answers the account one with Not
          # Authorized for this project. To the CLI a project token is RAILWAY_TOKEN and
          # an account token RAILWAY_API_TOKEN, and it sends RAILWAY_TOKEN whenever that
          # is set at all, even empty, so the run exports exactly one of them.
          PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ] && git diff --quiet "$prev" "$TAG" -- relay/; then
            echo "relay/ unchanged since $prev; the relay stays up"
            exit 0
          fi
          if [ -z "$PROJECT_TOKEN$ACCOUNT_TOKEN" ]; then
            echo "::warning::relay/ changed but there is no RAILWAY_PROJECT_TOKEN or RAILWAY_TOKEN in this repo's secrets; deploy it by hand: cd relay && railway up --detach"
            exit 0
          fi
          npm i -g @railway/cli
          cd relay
          if [ -n "$PROJECT_TOKEN" ]; then
            # The token names its own project and environment: nothing to link.
            export RAILWAY_TOKEN="$PROJECT_TOKEN"
          else
            export RAILWAY_API_TOKEN="$ACCOUNT_TOKEN"
            railway link --project 34e1da0b-5125-40be-9954-d90fafa3e156 --environment production --service hoenn-relay
          fi
          railway up --service hoenn-relay --detach --ci
