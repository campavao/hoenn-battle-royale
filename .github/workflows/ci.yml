name: BR CI

# Runs against the mod's own branch, not upstream's `master` (that's build.yml, pret's
# CI). Kept as a second workflow file instead of extending build.yml so a `git merge`
# from upstream never has to touch a line we own.
on:
  push:
    branches: [hoenn-battle-royale]
  pull_request:
    branches: [hoenn-battle-royale]

concurrency:
  group: br-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds both ROMs (baseline pret, and this fork) with agbcc - the byte-matching
  # compiler, because the release patch must be a diff of our changes only, never a
  # modern-GCC recompile of the whole game riding along. Ends with the one artifact
  # players' browsers actually load (never a .gba) and, since it already has a built
  # ROM sitting right there, the harness smoke test too (see the comment on that step
  # for why it isn't job of its own).
  rom:
    # needs wasm too now: the e2e steps at the end of this job boot the mGBA wasm core
    # in a real browser against the ROM this job just built, so both artifacts must be
    # on disk together before Playwright ever opens a page.
    needs: [wasm]
    runs-on: ubuntu-latest
    outputs:
      rom-sha1: ${{ steps.fork-rom.outputs.sha1 }}
      patch-size: ${{ steps.patch.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi \
            cmake zlib1g-dev
        # cmake + zlib1g-dev are only for the drive.sh smoke step at the end of this
        # job (libmgba, static, headless) - see that step.

      - name: Read baseline commit
        id: baseline
        run: echo "sha=$(cat tools/br/BASELINE_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: agbcc HEAD sha
        id: agbcc-sha
        run: echo "sha=$(git -C agbcc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache agbcc build
        id: agbcc-cache
        uses: actions/cache@v4
        with:
          path: agbcc
          key: agbcc-${{ steps.agbcc-sha.outputs.sha }}

      - name: Build agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        working-directory: agbcc
        run: ./build.sh

      - name: Checkout baseline pokeemerald
        uses: actions/checkout@v4
        with:
          repository: pret/pokeemerald
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline

      - name: Cache baseline ROM
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: baseline/pokeemerald.gba
          # The baseline never changes without BASELINE_COMMIT changing, so once this
          # is cached, every push and PR skips a ~9 minute clean pret build entirely.
          key: baseline-rom-${{ steps.baseline.outputs.sha }}

      - name: Build baseline ROM
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          ( cd agbcc && ./install.sh ../baseline )
          make -C baseline -j"$(nproc)"

      - name: Verify baseline ROM sha1
        # The whole point of pinning BASELINE_COMMIT is that this ROM is a known
        # quantity; a mismatch here means the pin or the agbcc build drifted, and every
        # downstream step (the patch, the symbols) would be diffing against the wrong
        # thing without this catching it first.
        run: tools/br/check-rom.sh baseline/pokeemerald.gba

      - name: Install agbcc into fork
        run: ( cd agbcc && ./install.sh .. )

      - name: Build fork ROM
        run: make -j"$(nproc)"

      - name: Fork ROM sha1
        id: fork-rom
        run: echo "sha1=$(sha1sum pokeemerald.gba | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Build patch, symbols, version
        id: patch
        run: |
          mkdir -p patch
          tools/br/make-patch.sh baseline/pokeemerald.gba pokeemerald.gba patch/hoenn-br.bps
          python3 tools/br/symbols.py pokeemerald.map > patch/br-symbols.json
          # And at the root, where tools/br/drive.sh looks for it. It is gitignored --
          # it is a build output, one per build -- so without this the drivers below
          # have no symbol table at all.
          cp patch/br-symbols.json br-symbols.json
          tools/br/version-json.sh pokeemerald.gba patch/br-version.json
          echo "size=$(stat -c%s patch/hoenn-br.bps)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### hoenn-br patch"
            echo "- patch size: ${{ steps.patch.outputs.size }} bytes"
            echo "- fork ROM sha1: ${{ steps.fork-rom.outputs.sha1 }}"
            echo "- baseline commit: ${{ steps.baseline.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: patch
          # Exactly these three files - never the ROM itself, on principle (see
          # CLAUDE.md: "the ROM is never anywhere but the player's device").
          path: |
            patch/hoenn-br.bps
            patch/br-symbols.json
            patch/br-version.json
          if-no-files-found: error

      - name: Cache libmgba (harness)
        id: mgba-cache
        uses: actions/cache@v4
        with:
          path: tools/br/.mgba
          key: libmgba-harness-0.10.5-v2-${{ runner.os }}

      - name: Drive the fork ROM
        # Every driver, not just `smoke`. The drivers ARE the ROM's test suite -- each
        # one boots the real thing, pokes the mailbox and asserts on RAM -- and running
        # one of them was running 3% of it.
        #
        # Folded into this job instead of a separate `harness` job: a standalone job
        # would either re-download the ROM as an artifact (banned - see above) or
        # rebuild it from scratch, doubling the build time for no reason when the ROM
        # this job just built is sitting right here on disk.
        run: |
          fail=0
          for d in tools/br/drivers/*.txt; do
            n=$(basename "$d" .txt)
            if tools/br/drive.sh "$n" pokeemerald.gba > "/tmp/$n.log" 2>&1; then
              echo "ok   $n"
            else
              echo "FAIL $n"
              tail -20 "/tmp/$n.log"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/download-artifact@v4
        with: { name: emu, path: web/public/emu }

      - name: Sidecars for the web shell's local-build path (POK-220)
        # web/e2e drives the shell the same way `npm run dev` does: a pre-patched ROM
        # plus these two sidecars, no BPS (see tools/br/dev-patch.sh and app.ts's
        # isPrePatched() branch). Same pokeemerald.gba/.map this job just built.
        run: tools/br/dev-patch.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npx playwright install --with-deps chromium

      - working-directory: web
        env:
          HBR_ROM: ${{ github.workspace }}/pokeemerald.gba
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          # Screenshots only, never the ROM (see the artifact-upload comment above).
          path: web/e2e/out
          if-no-files-found: warn

  # mGBA's own wasm fork, plus our EWRAM/IWRAM export patch. Different toolchain
  # entirely (emscripten, not agbcc) and no dependency on the ROM, so it starts in
  # parallel with `rom` -- `rom` waits on this one only for its own e2e steps at the
  # end, not for the ROM build itself.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5

      - name: Clone mgba-wasm at the pinned commit
        run: |
          git clone --branch feature/wasm https://github.com/thenick775/mgba mgba-wasm-src
          git -C mgba-wasm-src checkout "$(cat tools/br/mgba-wasm/COMMIT)"

      - name: Apply the EWRAM/IWRAM export patch
        working-directory: mgba-wasm-src
        run: git apply "$GITHUB_WORKSPACE/tools/br/mgba-wasm/hbr-exports.patch"

      # No build cache here: CMakeCache pins the emsdk path, which is a per-run temp dir.
      - name: Build the wasm core
        working-directory: mgba-wasm-src
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: emu
          path: |
            mgba-wasm-src/build-wasm/wasm/mgba.js
            mgba-wasm-src/build-wasm/wasm/mgba.wasm
            mgba-wasm-src/build-wasm/wasm/mgba.d.ts
          if-no-files-found: error

  # The shell needs both the patch and the emulator core in place before it can even
  # typecheck (public/patch and public/emu are real imports, not just static assets).
  web:
    needs: [rom, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: patch, path: web/public/patch }

      - uses: actions/download-artifact@v4
        with: { name: emu, path: web/public/emu }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npm run typecheck

      - working-directory: web
        run: npm test

      - working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          if-no-files-found: error

  # The relay's own suite: room protocol, the version gate, the flood disconnect, the
  # idle sweep, /health.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        working-directory: relay
        run: |
          npm ci --ignore-scripts
          node --test
