name: play log

# Scrapes the relay's log lines into a play history the site can draw (POK-248):
# rooms, matches, who played with whom, solo reports, and the five-minute heartbeat.
# Deliberately outside-in: the relay has no HTTP surface, and adding one would mean
# deploying it, which kills every match in progress.
#
# The data lives on the orphan `play-log` branch, never on this one: a commit every
# quarter hour would bury the code's history, and the site reads the branch raw
# (web/public/play.html), so nothing here needs a release to reach the page. Commits
# only when the numbers actually move, so an idle relay produces no history at all.
#
# Needs one secret: RAILWAY_PROJECT_TOKEN (least privilege, one environment) or
# RAILWAY_TOKEN. Kanto's relay_stats.yml is the parent of this file.
#
# Players' notes from the FEEDBACK screen (POK-428) are filed as issues on this repo,
# labelled "player feedback", with the run's own token (Cam, 11-11: GitHub rather than
# Linear). The issue is the one place a note goes: the play-log branch and this log never
# print one. The screen tells the player the note is public.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: play-log
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # players' notes (POK-428)

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The branch the data lives on, checked out beside the code. The first run finds
      # no such branch and starts one with nothing on it.
      - name: check out the play-log branch
        run: |
          if git ls-remote --exit-code --heads origin play-log >/dev/null; then
            # actions/checkout fetched one ref; the data branch has to be asked for
            git fetch --depth=1 origin play-log:refs/remotes/origin/play-log
            git worktree add --detach play-log origin/play-log
            git -C play-log checkout -B play-log origin/play-log
          else
            git worktree add --detach play-log
            git -C play-log checkout --orphan play-log
            git -C play-log rm -rfq . || true
            echo "# play-log" > play-log/README.md
            echo "Written by .github/workflows/play-log.yml from the relay's logs; read by /play.html." >> play-log/README.md
          fi

      # GitHub starts a `*/15` schedule every four to seven hours (2026-11-13..16: fifteen
      # runs in three days), so each run that does start keeps the quarter hour itself: it
      # reads, commits, sleeps and goes round again for five and a half hours, and the
      # schedule's next run waits behind it in the concurrency group. A dispatch is one pass.
      - name: read the relay's log every fifteen minutes
        timeout-minutes: 345
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_LOG_DIR: play-log
          PASSES: ${{ github.event_name == 'schedule' && '22' || '1' }}
        run: |
          if [ -z "$RAILWAY_TOKEN$RAILWAY_PROJECT_TOKEN" ]; then
            echo "::notice::no RAILWAY_PROJECT_TOKEN in this repo's secrets yet; nothing read"
            exit 0
          fi
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for pass in $(seq 1 "$PASSES"); do
            echo "::group::pass $pass of $PASSES ($(date -u +%H:%MZ))"
            # One bad read is not the end of the run: the next pass tries again.
            node tools/br/play-log.mjs || echo "::warning::pass $pass: play-log.mjs failed"
            # Vercel builds every pushed branch from the project's Root Directory, `web`, and
            # this branch has no web/, so each data commit failed a preview build and mailed
            # Cam. A stub vercel.json there turns deploys off for this branch only.
            mkdir -p play-log/web
            echo '{ "git": { "deploymentEnabled": false } }' > play-log/web/vercel.json
            (
              cd play-log
              git add -A
              if git diff --cached --quiet; then
                echo "nothing to commit"
              else
                summary=$(node -e "
                  let s = {}, p = {};
                  try { s = require('./stats.json'); } catch (e) {}
                  try { p = require('./play.json'); } catch (e) {}
                  process.stdout.write(((s.conns ?? 0) + (s.world ?? 0)) + ' playing, ' + (s.rooms ?? 0) + ' rooms, ' +
                    (p.sessions ? p.sessions.length + ' rooms logged' : 'no play log'));
                ")
                git commit -q -m "relay: $summary"
                git push origin play-log || echo "::warning::pass $pass: push failed"
              fi
            )
            echo "::endgroup::"
            if [ "$pass" -lt "$PASSES" ]; then sleep 900; fi
          done
